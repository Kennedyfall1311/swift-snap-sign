# PostgreSQL local para desenvolvimento/testes.
# Uso: docker compose -f vps/docker/docker-compose.local.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: assinaturas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: assinaturas_app
      POSTGRES_PASSWORD: senha_local_troque
      POSTGRES_DB: assinaturas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - assinaturas_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assinaturas_app -d assinaturas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  assinaturas_pgdata:
